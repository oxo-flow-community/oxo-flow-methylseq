# MultiQC configuration — adapted from upstream nf-core/methylseq 4.2.0
# assets/multiqc_config.yml. The report comment now points at the oxo-flow port;
# everything else is unchanged.
report_comment: >
  This report has been generated by the <a href="https://github.com/oxo-flow-community/oxo-flow-methylseq" target="_blank">oxo-flow-methylseq</a> analysis pipeline (oxo-flow port of nf-core/methylseq). For information about how to interpret these results, please see the <a href="https://nf-co.re/methylseq/4.2.0/docs/output" target="_blank">upstream documentation</a>.
report_section_order:
  "nf-core-methylseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-methylseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

table_columns_visible:
  QualiMap:
    avg_gc: false
    30_x_pc: false
    percentage_aligned: false
top_modules:
  - "bismark"
