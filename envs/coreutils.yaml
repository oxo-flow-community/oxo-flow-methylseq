# Environment for untarring a prebuilt Bismark index archive — pinned
# exactly to the upstream nf-core/methylseq 4.2.0 module environment
# (modules/nf-core/untar/environment.yml).
name: coreutils
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::coreutils=9.5
  - conda-forge::grep=3.11
  - conda-forge::gzip=1.13
  - conda-forge::lbzip2=2.5
  - conda-forge::sed=4.8
  - conda-forge::tar=1.34
